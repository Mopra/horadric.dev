[package]
name = "glance"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Every coding agent session as a tile on your desktop"

[[bin]]
name = "glance"
path = "src/main.rs"

[[bin]]
name = "glancew"
path = "src/glancew.rs"

[dependencies]
glance-core = { path = "../glance-core" }
glance-hooks = { path = "../glance-hooks" }
glance-ui = { path = "../glance-ui" }
serde_json = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
