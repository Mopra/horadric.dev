<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Remote screen</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #101114; color: #d8d8dc;
    font: 13px "Segoe UI", system-ui, sans-serif; overflow: hidden; }
  #bar { position: fixed; top: 0; left: 0; right: 0; height: 30px; display: flex;
    align-items: center; gap: 10px; padding: 0 10px; background: #1a1b20;
    border-bottom: 1px solid #2a2b31; z-index: 2; white-space: nowrap; }
  #state { min-width: 90px; color: #9a9aa2; }
  #state.live { color: #7fc77f; }
  #state.lost { color: #e07a6a; }
  #state.wait { color: #e0a86a; }
  #notice { color: #e0a86a; overflow: hidden; text-overflow: ellipsis; flex: 0 1 auto; }
  button { font: inherit; color: #d8d8dc; background: #26272e; border: 1px solid #3a3b44;
    border-radius: 4px; padding: 2px 10px; cursor: pointer; }
  button.on { background: #7a3a2a; border-color: #c0603e; color: #fff; }
  #keep:not([hidden]) { display: flex; gap: 6px; align-items: center; color: #e0a86a; }
  #zoom { display: flex; gap: 2px; align-items: center; }
  #zoom button { padding: 2px 7px; }
  #level { min-width: 38px; text-align: center; color: #9a9aa2; }
  select { font: inherit; color: #d8d8dc; background: #26272e; border: 1px solid #3a3b44;
    border-radius: 4px; padding: 1px 4px; }
  #stage { position: fixed; top: 31px; left: 0; right: 0; bottom: 0; overflow: auto; }
  /* Auto margins centre the picture while it is smaller than the stage and
     fall to nothing once it is larger, so scrolling reaches every edge
     instead of clipping the far side of a centred box. */
  #pad { display: flex; min-width: 100%; min-height: 100%; width: max-content; }
  #screen { display: block; margin: auto; user-select: none; -webkit-user-drag: none; }
  /* At fit nothing overflows, and a scrollbar from rounding would shrink
     the room the fit was worked out for. */
  #stage.fit { overflow: hidden; }
  #stage.pan { cursor: grab; }
  #stage.panning { cursor: grabbing; }
  #stage.control #screen { cursor: crosshair; outline: 2px solid #c0603e; }
  #halt:not([hidden]) { position: fixed; top: 31px; left: 0; right: 0; bottom: 0; z-index: 3;
    display: flex; align-items: center; justify-content: center; padding: 24px;
    text-align: center; font-size: 15px; color: #e07a6a; background: rgba(16, 17, 20, 0.9); }
</style>
</head>
<body>
<div id="bar">
  <span id="state">Connecting</span>
  <button id="control" title="Send mouse and keyboard to the remote. Esc twice stops.">Take control</button>
  <span id="zoom">
    <button id="out" title="Zoom out (Ctrl+wheel while not in control)">-</button>
    <span id="level">Fit</span>
    <button id="in" title="Zoom in (Ctrl+wheel while not in control)">+</button>
    <button id="one" title="Switch between fitting the tab and one remote pixel per screen pixel">1:1</button>
  </span>
  <select id="res" hidden title="The remote machine's own screen resolution"></select>
  <span id="keep" hidden>
    <span id="keepText"></span>
    <button id="keepYes">Keep</button>
    <button id="keepNo">Revert</button>
  </span>
  <span id="notice"></span>
</div>
<div id="stage"><div id="pad"><img id="screen" alt=""></div></div>
<div id="halt" hidden></div>
<script>
"use strict";
// The token arrives in the fragment, which no server is ever sent, and
// leaves the address before anything else runs: it then does not stay in
// the address, in history or in a saved tab. That is all the move does.
// Whatever can run script in this page can still read it.
const TOKEN_KEY = "horadric-screen-token";
let token = new URLSearchParams(location.hash.slice(1)).get("t") || "";
if (location.hash || location.search) history.replaceState(null, "", location.pathname);
const TOKEN_SHAPE = /^[0-9a-f]{32}$/i;
try {
  if (TOKEN_SHAPE.test(token)) sessionStorage.setItem(TOKEN_KEY, token);
  else token = sessionStorage.getItem(TOKEN_KEY) || "";
} catch (e) { /* storage refused: the token still lives in this page */ }
if (!TOKEN_SHAPE.test(token)) token = "";

const img = document.getElementById("screen");
const stage = document.getElementById("stage");
const stateEl = document.getElementById("state");
const button = document.getElementById("control");
const noticeEl = document.getElementById("notice");
const haltEl = document.getElementById("halt");
const levelEl = document.getElementById("level");
const oneButton = document.getElementById("one");
const resEl = document.getElementById("res");
const keepEl = document.getElementById("keep");
const keepText = document.getElementById("keepText");
const keepYes = document.getElementById("keepYes");
const keepNo = document.getElementById("keepNo");

// The remote's virtual screen as the last frame showed it, in its
// physical pixels.
let desk = { left: 0, top: 0, width: 0, height: 0 };
let control = false;
let shown = null;

function setState(text, cls) {
  stateEl.textContent = text;
  stateEl.className = cls || "";
}

const sleep = (ms) => new Promise((done) => setTimeout(done, ms));
const hex = (bytes) => Array.from(bytes, (b) => b.toString(16).padStart(2, "0")).join("");

// The link to the remote. The token goes only to a far end that has just
// proved it knows the token already: the port is a tunnel on this machine,
// and when the tunnel is gone anything may be listening there instead.
let proven = false;   // the far end proved itself and no request failed since
let proving = null;   // the one proof under way, shared by all who wait
let dead = false;     // stopped for good: nothing more is sent

// "yes" the far end knows the token, "no" something else answers, "down"
// nothing answers for now. Carries no token.
async function hello() {
  const nonce = hex(crypto.getRandomValues(new Uint8Array(16)));
  let r, body;
  try {
    r = await fetch("/hello?n=" + nonce, { cache: "no-store" });
    body = await r.text();
  } catch (e) { return "down"; }
  // A server that is full or failing says nothing about who it is.
  if (r.status >= 500) return "down";
  if (r.status !== 200) return "no";
  const enc = new TextEncoder();
  const key = await crypto.subtle.importKey(
    "raw", enc.encode(token), { name: "HMAC", hash: "SHA-256" }, false, ["sign"]);
  const want = hex(new Uint8Array(await crypto.subtle.sign("HMAC", key, enc.encode(nonce))));
  return body.trim() === want ? "yes" : "no";
}

async function proveLoop() {
  let wait = 1000;
  for (;;) {
    if (dead) throw new Error("stopped");
    const answer = await hello();
    if (dead) throw new Error("stopped");
    if (answer === "yes") { proven = true; return; }
    if (answer === "no") {
      stop("The remote's Horadric restarted, or something else answers on this port. Open the remote again.");
      throw new Error("stopped");
    }
    setState("Lost, retrying", "lost");
    await sleep(wait);
    wait = Math.min(wait * 2, 15000);
  }
}

// Resolves once the far end is proved, however long the link stays down.
function prove() {
  if (dead) return Promise.reject(new Error("stopped"));
  if (proven) return Promise.resolve();
  if (!proving) proving = proveLoop().finally(() => { proving = null; });
  return proving;
}

function auth() { return { Authorization: "Bearer " + token }; }

// One request with the token. The real server never redirects, so a
// redirect counts as a failure instead of being followed with the token.
async function send(path, init) {
  if (dead || !proven) throw new Error("no proved link");
  let r;
  try {
    r = await fetch(path, { cache: "no-store", redirect: "error", ...init, headers: auth() });
  } catch (e) {
    linkLost();
    throw e;
  }
  if (r.status === 403) {
    stale();
    throw new Error("stopped");
  }
  return r;
}

async function api(path, init) {
  await prove();
  return send(path, init);
}

// A request failed without an answer. Whatever answers next has to prove
// itself again, and input made for the screen as it was is not played
// into whatever is there once the link is back.
function linkLost() {
  proven = false;
  keepLettingGo();
}

// The remote's Horadric makes a new token at every start.
function stale() {
  try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) { /* nothing was kept */ }
  stop("The remote's Horadric restarted. Open the remote again.");
}

function stop(text) {
  if (dead) return;
  dead = true;
  proven = false;
  outbox.length = 0;
  held.clear();
  pressed.clear();
  clearTimeout(escapeTimer);
  escapeTimer = null;
  clearTimeout(pollTimer);
  clearTimeout(noticeTimer);
  noticeEl.textContent = "";
  noticeEl.title = "";
  endKeep();
  resEl.hidden = true;
  setControl(false);
  button.disabled = true;
  setState("Stopped", "lost");
  haltEl.textContent = text;
  haltEl.hidden = false;
}

// About five frames a second: the next fetch goes once the last picture
// is in, so a slow link gets fewer frames, never a queue of them.
const FRAME_MS = 200;
const LOCKED_MS = 2000;
let pollTimer = null;
let polling = false;
function schedule(ms) {
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, ms);
}
// Nobody sees a hidden tab's frames, and each one costs the remote a
// capture. Becoming visible starts the loop again.
async function poll() {
  if (dead || polling || document.hidden) return;
  polling = true;
  const began = performance.now();
  let next = 1000;
  try {
    const r = await api("/frame.jpg?w=" + wanted());
    if (r.status === 423) {
      const why = (await r.text()).trim() || "the desktop is locked";
      setState(why.charAt(0).toUpperCase() + why.slice(1), "wait");
      next = LOCKED_MS;
    } else if (!r.ok) {
      setState("Lost, retrying", "lost");
    } else {
      const was = desk;
      desk = {
        left: +r.headers.get("X-Screen-Left") || 0,
        top: +r.headers.get("X-Screen-Top") || 0,
        width: +r.headers.get("X-Screen-Width") || 0,
        height: +r.headers.get("X-Screen-Height") || 0,
      };
      const url = URL.createObjectURL(await r.blob());
      await new Promise((done) => { img.onload = img.onerror = done; img.src = url; });
      if (shown) URL.revokeObjectURL(shown);
      shown = url;
      if (desk.width !== was.width || desk.height !== was.height) {
        layout();
        // Changed over there, by the list below or by someone at the machine.
        if (was.width) loadDisplay();
      }
      if (!dead) setState(control ? "In control" : "Watching", "live");
      next = Math.max(0, FRAME_MS - (performance.now() - began));
    }
  } catch (e) {
    if (!dead) {
      // Also a picture cut off midway: the answer never fully came.
      linkLost();
      setState("Lost, retrying", "lost");
    }
  }
  polling = false;
  if (!dead && !document.hidden) schedule(next);
}

// Zoom counts remote pixels per device pixel of this screen: at 1 each
// pixel over there is one pixel here, which is as sharp as it gets.
const ZOOMS = [0.5, 0.75, 1, 1.5, 2];
const ZOOM_KEY = "horadric-screen-zoom";
let zoom = "fit";
try {
  const saved = localStorage.getItem(ZOOM_KEY);
  if (saved && ZOOMS.includes(+saved)) zoom = +saved;
} catch (e) { /* storage refused: start at fit */ }

function ratio() { return window.devicePixelRatio || 1; }

// The zoom at which the whole screen just fits the stage, both ways: a
// wide tab is often limited by its height, not its width.
function fitZoom() {
  if (!desk.width || !desk.height) return 1;
  const css = Math.min(stage.clientWidth / desk.width, stage.clientHeight / desk.height);
  return css * ratio();
}

function current() { return zoom === "fit" ? fitZoom() : zoom; }

// The picture is given its size outright. Left at its natural size, a
// frame fetched smaller than the stage (the first, or one during a resize)
// would stay small, and one in device pixels would show too large.
function layout() {
  if (desk.width && desk.height) {
    const css = current() / ratio();
    img.style.width = desk.width * css + "px";
    img.style.height = desk.height * css + "px";
  }
  levelEl.textContent = zoom === "fit" ? "Fit" : Math.round(zoom * 100) + "%";
  oneButton.textContent = zoom === "fit" ? "1:1" : "Fit";
  stage.classList.toggle("fit", zoom === "fit");
  stage.classList.toggle("pan", !control && zoom !== "fit");
}

// The frame width that fills the picture's device pixels exactly: any
// fewer and the browser stretches it soft, any more is sent for nothing.
function wanted() {
  if (!desk.width) return Math.max(16, Math.round(stage.clientWidth * ratio()));
  return Math.max(16, Math.min(desk.width, Math.round(desk.width * current())));
}

// Changes the zoom keeping the point at (x, y) of the stage where it is.
function setZoom(next, x, y) {
  if (x === undefined) { x = stage.clientWidth / 2; y = stage.clientHeight / 2; }
  const before = img.getBoundingClientRect();
  const box = stage.getBoundingClientRect();
  const fx = before.width ? (box.left + x - before.left) / before.width : 0.5;
  const fy = before.height ? (box.top + y - before.top) / before.height : 0.5;
  zoom = next;
  try { localStorage.setItem(ZOOM_KEY, String(zoom)); } catch (e) { /* kept for this page only */ }
  layout();
  stage.scrollLeft = img.offsetLeft + fx * img.offsetWidth - x;
  stage.scrollTop = img.offsetTop + fy * img.offsetHeight - y;
}

// One step along the levels, with fit standing at its own place among them.
function step(up, x, y) {
  const fit = fitZoom();
  const at = current();
  const near = (a, b) => Math.abs(a - b) < 0.01;
  const levels = ZOOMS.filter((z) => !near(z, fit)).concat([fit]).sort((a, b) => a - b);
  const next = up
    ? levels.find((z) => z > at + 0.001)
    : levels.slice().reverse().find((z) => z < at - 0.001);
  if (next === undefined) return;
  setZoom(next === fit ? "fit" : next, x, y);
}

document.getElementById("in").addEventListener("click", (e) => { step(true); e.currentTarget.blur(); });
document.getElementById("out").addEventListener("click", (e) => { step(false); e.currentTarget.blur(); });
oneButton.addEventListener("click", () => { setZoom(zoom === "fit" ? 1 : "fit"); oneButton.blur(); });
window.addEventListener("resize", layout);

// Ctrl+wheel zooms the picture while the remote is only watched. In control
// it belongs to the remote (zoom in its own apps), and the buttons remain.
stage.addEventListener("wheel", (e) => {
  if (!e.ctrlKey) return;
  // Never the pane's own zoom, in control or not: it would change the
  // picture's size under the sums above.
  e.preventDefault();
  if (control || !e.deltaY) return;
  const box = stage.getBoundingClientRect();
  step(e.deltaY < 0, e.clientX - box.left, e.clientY - box.top);
}, { passive: false });

// Dragging pans a picture larger than the stage, while not in control.
let panning = null;
stage.addEventListener("mousedown", (e) => {
  if (control || e.button !== 0 || zoom === "fit") return;
  e.preventDefault();
  panning = { x: e.clientX, y: e.clientY, left: stage.scrollLeft, top: stage.scrollTop };
  stage.classList.add("panning");
});
window.addEventListener("mousemove", (e) => {
  if (!panning) return;
  stage.scrollLeft = panning.left - (e.clientX - panning.x);
  stage.scrollTop = panning.top - (e.clientY - panning.y);
});
window.addEventListener("mouseup", () => {
  if (!panning) return;
  panning = null;
  stage.classList.remove("panning");
});

// The remote's own resolution. An older server has no /display, and then
// the list stays hidden.
let modes = [];
const modeName = (m) => m.width + " × " + m.height;
async function loadDisplay() {
  try {
    const r = await api("/display");
    if (r.status === 404) { resEl.hidden = true; return; }
    if (!r.ok) return;
    const d = await r.json();
    const cur = d.current;
    const same = (m) => cur && m.width === cur.width && m.height === cur.height;
    modes = (d.modes || []).slice();
    if (cur && !modes.some(same)) modes.unshift(cur);
    resEl.replaceChildren(...modes.map((m, i) => {
      const o = document.createElement("option");
      o.value = String(i);
      o.textContent = modeName(m);
      o.selected = same(m);
      return o;
    }));
    resEl.hidden = dead || !modes.length;
  } catch (e) { /* the frame loop already says the link is down */ }
}

// A new resolution is on trial: the remote goes back by itself unless it
// is told to keep it, so a mode that shows nothing usable here undoes
// itself. Revert asks for the return at once, and when that does not get
// through the time simply runs out.
let keepTimer = null;
function endKeep() {
  clearInterval(keepTimer);
  keepTimer = null;
  keepEl.hidden = true;
  resEl.disabled = false;
}
function offerKeep(seconds) {
  const until = performance.now() + seconds * 1000;
  let reverting = false;
  const say = () => {
    const left = Math.ceil((until - performance.now()) / 1000);
    if (left <= 0) {
      endKeep();
      // The remote counts from a little earlier than this page does.
      setTimeout(loadDisplay, 1000);
      return;
    }
    keepText.textContent = (reverting ? "Reverting in " : "Keep this resolution? Reverting in ")
      + left + " s";
  };
  keepYes.hidden = keepNo.hidden = false;
  keepYes.disabled = false;
  keepYes.onclick = async () => {
    keepYes.disabled = true;
    try {
      const r = await api("/display/keep", { method: "POST" });
      if (!r.ok) notice((await r.text()) || "the remote did not keep the resolution (" + r.status + ")");
    } catch (e) {
      // Still time to try again while the count runs.
      notice("the answer did not reach the remote");
      keepYes.disabled = false;
      return;
    }
    if (keepTimer) { endKeep(); loadDisplay(); }
  };
  keepNo.onclick = async () => {
    reverting = true;
    keepYes.hidden = keepNo.hidden = true;
    say();
    try {
      const r = await api("/display/revert", { method: "POST" });
      if (!r.ok) return;
    } catch (e) { return; }
    if (keepTimer) { endKeep(); loadDisplay(); }
  };
  resEl.disabled = true;
  keepEl.hidden = false;
  clearInterval(keepTimer);
  keepTimer = setInterval(say, 250);
  say();
}
resEl.addEventListener("change", async () => {
  const m = modes[+resEl.value];
  resEl.blur();
  if (!m) return;
  try {
    const r = await api("/display", {
      method: "POST", body: JSON.stringify({ width: m.width, height: m.height }),
    });
    if (r.ok) {
      const d = await r.json().catch(() => ({}));
      offerKeep(+d.keep_within > 0 ? +d.keep_within : 15);
    } else {
      notice((await r.text()) || "the remote refused the resolution (" + r.status + ")");
    }
  } catch (e) { if (!dead) notice("the resolution change did not reach the remote"); }
  // Also puts the list back on the resolution in use when it was refused.
  loadDisplay();
});

// Why the remote refused an input, shown for a few seconds.
let noticeTimer = null;
function notice(text) {
  if (dead) return;
  noticeEl.textContent = text;
  noticeEl.title = text;
  clearTimeout(noticeTimer);
  noticeTimer = setTimeout(() => { noticeEl.textContent = ""; noticeEl.title = ""; }, 5000);
}

// What may be down on the remote. A key or button is put here when its
// press is queued and leaves only when the remote answered its release:
// a release that got lost must be sent again, or it stays down over there.
const held = new Set();      // virtual keys
const pressed = new Set();   // mouse buttons

// Events go in one request at a time, each once the one before is
// answered: separate requests may arrive in any order, and an up before
// its down leaves a button held over there. All that wait go together as
// one list, which the remote runs as one sequence.
const outbox = [];
const repeats = new WeakSet();   // waiting events that only repeat a held key
let sending = false;
const OUTBOX_MAX = 200;
const BATCH_MAX = 256;
// Under the remote's 64 KiB, with room left for the release sent beside
// it when the tab closes (the browser caps what such requests carry).
const BODY_MAX = 60000;
const WHEEL_MAX = 12000;

// Events that let go of something. They are never dropped.
function letsGo(e) {
  return e.kind === "up" || e.kind === "release" || (e.kind === "key" && !e.down);
}

function keepLettingGo() {
  const keep = outbox.filter(letsGo);
  outbox.length = 0;
  outbox.push(...keep);
}

// False when the event was not taken, so the caller does not count a key
// or button as down that never went.
function post(event, repeat) {
  if (dead) return false;
  if (!letsGo(event)) {
    // With the link down nothing new waits for it: played later it would
    // land on a screen nobody was looking at.
    if (!control || !proven) return false;
    const last = outbox[outbox.length - 1];
    if (event.kind === "move" && last && last.kind === "move") {
      // Only where the pointer ends up matters.
      outbox[outbox.length - 1] = event;
      pump();
      return true;
    }
    if (event.kind === "wheel" || event.kind === "hwheel") {
      // Summed into the one already waiting. It may pass moves and the
      // other wheel on the way, which changes nothing: each carries its
      // own position.
      for (let i = outbox.length - 1; i >= 0; i -= 1) {
        const w = outbox[i];
        if (w.kind === event.kind) {
          const sum = Math.max(-WHEEL_MAX, Math.min(WHEEL_MAX, w.delta + event.delta));
          outbox[i] = { ...event, delta: sum };
          pump();
          return true;
        }
        if (w.kind !== "move" && w.kind !== "wheel" && w.kind !== "hwheel") break;
      }
    }
    if (repeat) {
      if (event.kind === "key"
        && outbox.some((w) => w.kind === "key" && w.down && w.vk === event.vk)) return true;
      repeats.add(event);
    }
  }
  outbox.push(event);
  trim();
  pump();
  return true;
}

// A link slower than the hand: what matters least goes first, and a
// letting go never.
function trim() {
  while (outbox.length > OUTBOX_MAX) {
    let i = outbox.findIndex((e) => e.kind === "move");
    if (i < 0) i = outbox.findIndex((e) => repeats.has(e));
    if (i < 0) i = outbox.findIndex((e) => !letsGo(e));
    if (i < 0) return;
    outbox.splice(i, 1);
  }
}

function take() {
  const enc = new TextEncoder();
  let n = 0, size = 2;
  while (n < outbox.length && n < BATCH_MAX) {
    const len = enc.encode(JSON.stringify(outbox[n])).length + 1;
    if (n && size + len > BODY_MAX) break;
    size += len;
    n++;
  }
  return outbox.splice(0, n);
}

// The remote answered this batch: what it let go of is forgotten, unless
// a press of the same thing is already waiting behind it.
function settle(batch) {
  for (const e of batch) {
    if (e.kind === "key") { if (e.down) held.add(e.vk); else held.delete(e.vk); }
    else if (e.kind === "down") pressed.add(e.button);
    else if (e.kind === "up") pressed.delete(e.button);
    else if (e.kind === "release") { held.clear(); pressed.clear(); }
  }
  for (const e of outbox) {
    if (e.kind === "key" && e.down) held.add(e.vk);
    else if (e.kind === "down") pressed.add(e.button);
  }
}

// Runs whether in control or not: what lets go must still get there
// after control was given up.
async function pump() {
  if (sending || dead) return;
  sending = true;
  let wait = 1000;
  try {
    while (outbox.length && !dead) {
      // Proved before the batch is taken, so that a link lost meanwhile
      // can still clear out what waits.
      await prove();
      const batch = take();
      if (!batch.length) break;
      const body = JSON.stringify(batch.length === 1 ? batch[0] : batch);
      let r;
      try {
        r = await send("/input", { method: "POST", body });
      } catch (e) {
        if (dead) break;
        // No telling whether it ran. The presses are not played twice;
        // what lets go is harmless twice and goes again.
        outbox.unshift(...batch.filter(letsGo));
        await sleep(500);
        continue;
      }
      if (r.ok) {
        settle(batch);
        wait = 1000;
        continue;
      }
      notice((await r.text().catch(() => "")) || "the remote refused input (" + r.status + ")");
      if (r.status === 400 || r.status === 413) {
        // Refused as written, so the same again would be refused again.
        // One release lets go of whatever the batch was meant to.
        if (batch.some(letsGo) && !batch.some((e) => e.kind === "release")) {
          outbox.unshift({ kind: "release" });
        }
        continue;
      }
      outbox.unshift(...batch.filter(letsGo));
      // Slower each time: past five seconds of quiet the remote lets go
      // of everything by itself.
      await sleep(wait);
      wait = Math.min(wait * 2, 15000);
    }
  } catch (e) {
    // The proof could not be worked out. Stopped for good, or worth
    // another try in a moment, never at once in a tight loop.
    if (!dead) setTimeout(pump, 1000);
  }
  sending = false;
}

// The remote lets go of everything once it hears nothing for five
// seconds. A key held on purpose with nothing else going on says so.
setInterval(() => {
  if (!control || dead || !proven || sending || outbox.length) return;
  if (!held.size && !pressed.size) return;
  outbox.push({ kind: "alive" });
  pump();
}, 2000);

// Where on the remote's virtual screen a point of the picture is. The
// picture's box is in the same viewport measure as the pointer, so zoom
// and scrolling are already in it. Floor, since a pixel owns the whole
// span from its left edge to the next: rounding would hand its right
// half to the neighbour.
function at(e) {
  const r = img.getBoundingClientRect();
  if (!r.width || !r.height || !desk.width || !desk.height) return null;
  const x = Math.floor((e.clientX - r.left) / r.width * desk.width);
  const y = Math.floor((e.clientY - r.top) / r.height * desk.height);
  return {
    x: Math.min(Math.max(x, 0), desk.width - 1),
    y: Math.min(Math.max(y, 0), desk.height - 1),
  };
}

const BUTTONS = ["left", "middle", "right"];
let lastAt = null;           // the last position sent or about to be
let moveTimer = null, lastMove = null;
img.addEventListener("mousemove", (e) => {
  if (!control) return;
  lastMove = at(e);
  if (lastMove) lastAt = lastMove;
  // At most one move each 40 ms; the last one always goes.
  if (moveTimer) return;
  moveTimer = setTimeout(() => {
    moveTimer = null;
    if (lastMove) post({ kind: "move", ...lastMove });
  }, 40);
});
img.addEventListener("mousedown", (e) => {
  const b = BUTTONS[e.button];
  if (!control || !b) return;
  e.preventDefault();
  const p = at(e);
  if (!p) return;
  lastAt = p;
  if (post({ kind: "down", ...p, button: b })) pressed.add(b);
});
window.addEventListener("mouseup", (e) => {
  const b = BUTTONS[e.button];
  // Only a button that went down on the picture: a click on the bar is
  // this page's own and must not let go of anything over there.
  if (!control || !b || !pressed.has(b)) return;
  const p = at(e) || lastAt;
  if (!p) return;
  lastAt = p;
  post({ kind: "up", ...p, button: b });
});
img.addEventListener("wheel", (e) => {
  if (!control) return;
  e.preventDefault();
  const p = at(e);
  if (!p) return;
  lastAt = p;
  // A notch is 120 on Windows and about 100 pixels in a browser.
  const per = e.deltaMode === 1 ? 40 : e.deltaMode === 2 ? 800 : 1.2;
  const notches = (d) => Math.max(-1200, Math.min(1200, Math.round(d * per)));
  // Windows counts up and right as positive, a browser down and right.
  const delta = notches(-e.deltaY);
  const across = notches(e.deltaX);
  if (delta) post({ kind: "wheel", ...p, delta });
  if (across) post({ kind: "hwheel", ...p, delta: across });
}, { passive: false });
document.addEventListener("contextmenu", (e) => { if (control) e.preventDefault(); });

// KeyboardEvent.code to a Windows virtual key. The code names the key's
// place, not its letter, so the remote's own layout decides what it types.
// None of the keys the remote refuses is here (sleep, the browser, media
// and launch keys, the mouse button codes).
const VK = {
  Backspace: 8, Tab: 9, Enter: 13, NumpadEnter: 13, ShiftLeft: 160, ShiftRight: 161,
  ControlLeft: 162, ControlRight: 163, AltLeft: 164, AltRight: 165, Pause: 19,
  CapsLock: 20, Escape: 27, Space: 32, PageUp: 33, PageDown: 34, End: 35, Home: 36,
  ArrowLeft: 37, ArrowUp: 38, ArrowRight: 39, ArrowDown: 40, PrintScreen: 44,
  Insert: 45, Delete: 46, MetaLeft: 91, MetaRight: 92, OSLeft: 91, OSRight: 92,
  ContextMenu: 93, NumpadMultiply: 106, NumpadAdd: 107, NumpadSubtract: 109,
  NumpadDecimal: 110, NumpadDivide: 111, NumLock: 144, ScrollLock: 145,
  Semicolon: 186, Equal: 187, Comma: 188, Minus: 189, Period: 190, Slash: 191,
  Backquote: 192, BracketLeft: 219, Backslash: 220, BracketRight: 221, Quote: 222,
  IntlBackslash: 226,
};
for (let i = 0; i < 26; i++) VK["Key" + String.fromCharCode(65 + i)] = 65 + i;
for (let i = 0; i < 10; i++) { VK["Digit" + i] = 48 + i; VK["Numpad" + i] = 96 + i; }
for (let i = 1; i <= 24; i++) VK["F" + i] = 111 + i;

function keyEvent(code, vk, down) {
  const event = { kind: "key", vk, down };
  // The numpad's Enter shares its virtual key with the main one and is
  // told apart as an extended key.
  if (code === "NumpadEnter") event.ext = true;
  return event;
}

const ESCAPE = 27;
const ESCAPE_TWICE_MS = 600;
let escapeTimer = null;      // a first Esc held back, in case a second ends control

function sendEscape() {
  post({ kind: "key", vk: ESCAPE, down: true });
  post({ kind: "key", vk: ESCAPE, down: false });
}

function printable(e) {
  // One character, not a name like "Enter"; AltGr makes characters too.
  const one = [...e.key].length === 1;
  const plain = !e.ctrlKey && !e.altKey && !e.metaKey;
  const altGr = e.getModifierState("AltGraph");
  // Space goes as a key: typed as text it would not press the button or
  // tick the box that has the focus over there.
  if (e.code === "Space" && e.key === " " && !altGr) return false;
  return one && (plain || altGr);
}

// Lets go of everything held over there, keys and mouse buttons alike,
// with the one event the remote answers by releasing all it holds.
// `leaving` is for a tab that may be gone before the queue is through.
function release(leaving) {
  if (dead) return;
  if (escapeTimer) {
    // One Esc pressed and nothing after it: it was meant for the remote.
    clearTimeout(escapeTimer);
    escapeTimer = null;
    sendEscape();
  }
  if (!held.size && !pressed.size) return;
  if (leaving === true && proven) {
    // Sent beside the queue and allowed to outlive the page. It may
    // overtake a request still on its way, which is why the queue sends
    // its own after it when the page lives on.
    fetch("/input", {
      method: "POST", keepalive: true, cache: "no-store", redirect: "error",
      headers: auth(), body: JSON.stringify({ kind: "release" }),
    }).then((r) => { if (r.status === 403) stale(); }, linkLost);
  }
  const last = outbox[outbox.length - 1];
  if (!last || last.kind !== "release") outbox.push({ kind: "release" });
  pump();
}

window.addEventListener("keydown", (e) => {
  if (!control) return;
  e.preventDefault();
  const plain = !e.ctrlKey && !e.altKey && !e.shiftKey && !e.metaKey;
  if (e.code === "Escape" && plain) {
    // A plain Esc waits to see whether a second follows, so the two that
    // end control send nothing; its release is not held, so it goes
    // nowhere either.
    if (e.repeat) return;
    if (escapeTimer) {
      clearTimeout(escapeTimer);
      escapeTimer = null;
      setControl(false);
      return;
    }
    escapeTimer = setTimeout(() => { escapeTimer = null; sendEscape(); }, ESCAPE_TWICE_MS);
    return;
  }
  if (printable(e)) {
    if (e.getModifierState("AltGraph")) {
      // AltGr arrives as Ctrl and Alt, and a character typed under them
      // would be a shortcut over there.
      for (const vk of [162, 163, 164, 165]) {
        if (held.has(vk)) post({ kind: "key", vk, down: false });
      }
    }
    post({ kind: "text", text: e.key }, e.repeat);
    return;
  }
  if (e.key === "Dead") return;
  const vk = VK[e.code];
  if (!vk) return;
  if (post(keyEvent(e.code, vk, true), e.repeat)) held.add(vk);
});
window.addEventListener("keyup", (e) => {
  if (!control) return;
  e.preventDefault();
  // Whatever this key last sent, a press of it as a key may still be down
  // over there: it went down under Ctrl, say, and repeated as text after.
  const vk = VK[e.code];
  if (!vk || !held.has(vk)) return;
  post(keyEvent(e.code, vk, false));
});
// A key held when the tab loses focus, is hidden or is closed would stay
// down over there.
window.addEventListener("blur", () => release());
window.addEventListener("pagehide", () => release(true));
document.addEventListener("visibilitychange", () => {
  if (document.hidden) release(true);
  else schedule(0);
});

function setControl(on) {
  if (!on) release();
  control = on;
  button.classList.toggle("on", on);
  button.textContent = on ? "Release control" : "Take control";
  stage.classList.toggle("control", on);
  layout();
  if (stateEl.className === "live") setState(on ? "In control" : "Watching", "live");
  button.blur();
}
button.addEventListener("click", () => setControl(!control && !dead));

layout();
if (!token) {
  stop("This page was opened without its key. Open the remote again.");
} else if (!window.crypto || !crypto.subtle) {
  stop("This page can only check the remote when opened on 127.0.0.1. Open the remote again.");
} else {
  poll();
  loadDisplay();
}
</script>
</body>
</html>
