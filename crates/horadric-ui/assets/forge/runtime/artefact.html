<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Artefact</title>
<link rel="stylesheet" href="runtime.css">
<script src="runtime.js"></script>
<style>
/* The runtime draws its error card with inline styles, so it shows even
   when the class compiler is what broke; these override them with
   Horadric's look, whose colours the Forge sets on the page. The
   artefact itself keeps its own look. */
[data-forge-error] {
  margin: 24px !important; padding: 16px 20px 18px !important; border: 0 !important;
  border-radius: 10px !important; background: var(--hd-screen, #060709) !important;
  color: var(--hd-read, #d4d5d9) !important;
  font: 13px/1.55 "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif !important;
  box-shadow: inset 0 2px 7px var(--hd-hollow-shade, rgba(0, 0, 0, 0.55)),
    inset 3px 0 0 var(--hd-error, #ff5d66), 0 0 0 6px var(--hd-plate, #151619) !important;
}
[data-forge-error] > div:first-child { color: var(--hd-error, #ff5d66) !important; }
[data-forge-error] pre {
  margin-top: 4px !important; color: var(--hd-read, #d4d5d9) !important;
  font: 12px/1.55 "Cascadia Mono", "Cascadia Code", Consolas, monospace !important;
}
</style>
</head>
<body>
<div id="root"></div>
<script>
// Contract: served beside runtime.js on the Forge's virtual host, as
// artefact.html?src=<url of the .jsx, .tsx or .mmd file>. The page fetches the
// source itself, so a reload of this page is a reload of the artefact.
// Horadric serves this page at the artefact's own address instead (so the
// tab stays the file's), with <base> at the runtime folder and the source's
// address in <meta name="forge-src">.
(function () {
  var meta = document.querySelector('meta[name="forge-src"]');
  var src = new URLSearchParams(location.search).get("src") || (meta && meta.content);
  var root = document.getElementById("root");
  if (!src) {
    root.textContent = "artefact.html needs ?src=<path of the artefact>";
    return;
  }
  var name = decodeURIComponent(src.split("?")[0].split("/").pop());
  document.title = name;
  // The Forge's page side (forge.js) shows a card with "Send to session" for
  // errors it hears; the runtime's own are caught, so they are handed over.
  // Kind "runtime" errors were uncaught, and forge.js heard them already.
  window.__forgeRuntime.onError(function (d) {
    if (d.kind === "runtime" || !window.__forge || !window.__forge.report) return;
    // No column: it counts in the compiled line, not the one Claude wrote.
    var where = (d.file || name) + (d.line ? ":" + d.line : "");
    var message = where + ": " + d.message;
    window.__forge.report({ message: message, stack: d.stack || d.componentStack || "" }, message);
  });
  // Errors are already reported through __forgeRuntime.onError and drawn in
  // the page; the rejection is only swallowed here so it is not reported twice.
  window.__forgeRuntime.load(src, root).catch(function () {});
})();
</script>
</body>
</html>
