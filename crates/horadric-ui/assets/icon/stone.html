<!doctype html>
<html><head><meta charset="utf-8"><title>Horadric rune stone</title>
<!-- The source of the Horadric icon. Open it to tune the stone; bake.py renders the icon from it. -->
<style>
  body { background:#050506; color:#e8e9ed; font:14px/1.5 "Segoe UI", sans-serif; margin:32px; }
  h1 { font-weight:500; letter-spacing:.04em; margin:0 0 12px; }
  .ctl { color:#8f939e; display:flex; gap:22px; align-items:center; flex-wrap:wrap; }
  input[type=range] { width:160px; vertical-align:middle; }
  button { background:#1b1c21; color:#e8e9ed; border:1px solid #2b2d34; border-radius:4px; padding:4px 10px; cursor:pointer; }
  .row { display:flex; gap:28px; align-items:flex-end; padding:20px 0; border-top:1px solid #16171b; margin-top:16px; }
  .tray { background:#202020; padding:6px; border-radius:4px; display:flex; gap:10px; }
  .lightbg { background:#e9e9ec; padding:10px; border-radius:6px; display:flex; gap:12px; align-items:flex-end; }
  #hero { width:640px; height:640px; display:block; }
</style></head>
<body>
<h1>The rune stone</h1>
<div class="ctl">
  <label>Turn <input id="yaw" type="range" min="0" max="90" value="52"></label>
  <label>Tilt <input id="pitch" type="range" min="5" max="50" value="25"></label>
  <label>Roughness <input id="rough" type="range" min="0" max="100" value="100"></label>
  <label>Chips <input id="chips" type="range" min="0" max="100" value="40"></label>
  <label>Rune light <input id="glow" type="range" min="0" max="100" value="2"></label>
  <label>Stone seed <input id="seed" type="range" min="0" max="50" value="11"></label>
  <span id="swatches"></span>
  <button id="save">Save 1024 px PNG</button>
</div>
<canvas id="hero"></canvas>
<div class="row" id="sizes"></div>
<div class="row" id="states"></div>
<canvas id="gl" style="display:none"></canvas>
<script>
const LIGHTS = { gold: [1.0, .62, .2], red: [1.0, .25, .3], blue: [.2, .62, 1.0], green: [.2, .9, .5], violet: [.62, .42, 1.0], white: [1, 1, 1], none: [0, 0, 0] };
let current = 'gold';

const FS = `#version 300 es
precision highp float;
uniform vec2 res;
uniform vec3 lightCol;
uniform float tumble, yaw, pitch, rough, chips, glowK, seed, simple, stoneOnly, zoom, bright;
out vec4 frag;

float h31(vec3 p) { p = fract(p * .3183099 + .1); p *= 17.; return fract(p.x * p.y * p.z * (p.x + p.y + p.z)); }
float vnoise(vec3 x) {
  vec3 i = floor(x), f = fract(x); f = f * f * (3. - 2. * f);
  return mix(mix(mix(h31(i), h31(i + vec3(1,0,0)), f.x), mix(h31(i + vec3(0,1,0)), h31(i + vec3(1,1,0)), f.x), f.y),
             mix(mix(h31(i + vec3(0,0,1)), h31(i + vec3(1,0,1)), f.x), mix(h31(i + vec3(0,1,1)), h31(i + vec3(1,1,1)), f.x), f.y), f.z);
}
float fbm(vec3 p) { float a = .5, s = 0.; for (int i = 0; i < 5; i++) { s += a * vnoise(p); p = p * 2.03 + vec3(1.7, 9.2, 3.1); a *= .5; } return s; }
float ridged(vec3 p) { float a = .5, s = 0.; for (int i = 0; i < 4; i++) { float n = 1. - abs(vnoise(p) * 2. - 1.); s += a * n * n; p = p * 2.1 + 3.3; a *= .5; } return s; }

float seg(vec2 p, vec2 a, vec2 b) { vec2 pa = p - a, ba = b - a; float h = clamp(dot(pa, ba) / dot(ba, ba), 0., 1.); return length(pa - ba * h); }
float glyph(vec2 p, int g) {
  float d = 1e3;
  if (simple > .5) { d = min(seg(p, vec2(0,-1), vec2(0,1)), seg(p, vec2(-.6,.15), vec2(.6,.15))); return d; }
  if (g == 0) { d = min(d, seg(p, vec2(0,-1), vec2(0,1))); d = min(d, seg(p, vec2(0,.2), vec2(-.62,.82))); d = min(d, seg(p, vec2(0,.2), vec2(.62,.82))); d = min(d, seg(p, vec2(-.42,-.5), vec2(.42,-.5))); }
  else if (g == 1) { d = min(d, seg(p, vec2(-.6,.9), vec2(.6,-.9))); d = min(d, seg(p, vec2(.6,.9), vec2(-.6,-.9))); d = min(d, seg(p, vec2(-.6,.9), vec2(.6,.9))); d = min(d, seg(p, vec2(-.6,-.9), vec2(.6,-.9))); }
  else if (g == 2) { d = min(d, seg(p, vec2(-.7,1), vec2(-.7,-1))); d = min(d, seg(p, vec2(-.7,.45), vec2(.7,1))); d = min(d, seg(p, vec2(-.7,-.15), vec2(.7,.4))); d = min(d, seg(p, vec2(.7,-1), vec2(.05,-.45))); }
  else if (g == 3) { d = min(d, seg(p, vec2(0,1), vec2(.62,0))); d = min(d, seg(p, vec2(.62,0), vec2(0,-1))); d = min(d, seg(p, vec2(0,-1), vec2(-.62,0))); d = min(d, seg(p, vec2(-.62,0), vec2(0,1))); d = min(d, seg(p, vec2(0,1), vec2(0,-1))); }
  else if (g == 4) { d = min(d, seg(p, vec2(-.8,-.7), vec2(0,.9))); d = min(d, seg(p, vec2(0,.9), vec2(.8,-.7))); d = min(d, seg(p, vec2(.8,-.7), vec2(-.8,-.7))); d = min(d, seg(p, vec2(0,.9), vec2(0,-.2))); }
  else { d = min(d, seg(p, vec2(-.7,.85), vec2(.7,.3))); d = min(d, seg(p, vec2(.7,.3), vec2(-.7,-.25))); d = min(d, seg(p, vec2(-.7,-.25), vec2(.7,-.8))); d = min(d, seg(p, vec2(0,1), vec2(0,-1))); }
  return d;
}
// Distance, in the plane of the nearest face, to that face's rune.
float runeDO(vec3 p) {
  vec3 a = abs(p); vec2 uv; int f;
  if (a.y >= a.x && a.y >= a.z) { f = p.y > 0. ? 2 : 3; uv = vec2(p.x, -p.z * sign(p.y)); }
  else if (a.x >= a.z) { f = p.x > 0. ? 0 : 1; uv = vec2(p.z * sign(p.x), p.y); }
  else { f = p.z > 0. ? 4 : 5; uv = vec2(-p.x * sign(p.z), p.y); }
  int g = f == 0 ? 0 : f == 2 ? 1 : f == 5 ? 2 : f == 1 ? 3 : f == 4 ? 4 : 5;
  float s = simple > .5 ? .5 : .46;
  return glyph(uv / s, g) * s;
}
float runeW() { return simple > .5 ? .1 : .042; }

float mapO(vec3 p) {
  vec3 q = abs(p) - vec3(.8);
  float box = length(max(q, 0.)) + min(max(q.x, max(q.y, q.z)), 0.) - .14;
  vec3 a = abs(p);
  float mx = max(a.x, max(a.y, a.z)), mn = min(a.x, min(a.y, a.z)), md = a.x + a.y + a.z - mx - mn;
  float edge = smoothstep(.55, .92, md);
  vec3 s = p + seed;
  float d = box;
  // Broad planes and crags, then fine grain. Chips bite only near the edges.
  d += (fbm(s * 1.4) - .5) * .08 * rough;
  d += (ridged(s * 3.6) - .35) * .028 * rough;
  d += (vnoise(s * 14.) - .5) * .006 * rough;
  d += edge * max(0., fbm(s * 2.6 + 11.) - .45) * .45 * chips;
  float w = runeW();
  d += (1. - smoothstep(w * .5, w, runeDO(p))) * .085;
  return d;
}
// The stone tumbled forward by the tumble angle about the view's right, for the
// tiles' tumbling stone: world to the stone's own space.
vec3 tAxis = vec3(1, 0, 0);
vec3 obj(vec3 p) {
  float c = cos(tumble), s = sin(tumble);
  return p * c + cross(tAxis, p) * s + tAxis * dot(tAxis, p) * (1. - c);
}
float map(vec3 p) { return mapO(obj(p)); }
float runeD(vec3 p) { return runeDO(obj(p)); }
vec3 normalAt(vec3 p) {
  const vec2 k = vec2(1, -1); float e = .0015;
  return normalize(k.xyy * map(p + k.xyy * e) + k.yyx * map(p + k.yyx * e) + k.yxy * map(p + k.yxy * e) + k.xxx * map(p + k.xxx * e));
}
float shadow(vec3 ro, vec3 rd) {
  float r = 1., t = .02;
  for (int i = 0; i < 48; i++) { float h = map(ro + rd * t); r = min(r, 10. * h / t); t += clamp(h, .01, .15); if (r < .002 || t > 4.) break; }
  return clamp(r, 0., 1.);
}
float occlusion(vec3 p, vec3 n) {
  float o = 0., w = 1.;
  for (int i = 1; i <= 5; i++) { float h = .025 * float(i); o += w * (h - map(p + n * h)); w *= .6; }
  return clamp(1. - 5. * o, 0., 1.);
}
vec3 aces(vec3 x) { return clamp((x * (2.51 * x + .03)) / (x * (2.43 * x + .59) + .14), 0., 1.); }

void main() {
  vec2 uv = (gl_FragCoord.xy * 2. - res) / res.y;
  float cy = cos(yaw), sy = sin(yaw), cp = cos(pitch), sp = sin(pitch);
  vec3 ro = 6.2 * vec3(cp * sy, sp, -cp * cy);
  vec3 fw = normalize(-ro), rt = normalize(cross(vec3(0,1,0), fw)), up = cross(fw, rt);
  tAxis = rt;
  // Seen from above, the stone's middle is below the view's; zoomed in, that shows, so lift it back.
  uv.y -= (zoom - 1.) * .21;
  vec3 rd = normalize(fw + (uv.x * rt + uv.y * up) * .3 / zoom);
  vec3 key = normalize(-.55 * rt + .85 * up - .35 * fw);
  vec3 rim = normalize(.75 * rt + .35 * up + .7 * fw);

  float t = 4.;
  bool hit = false;
  float glowAcc = 0.;
  for (int i = 0; i < 400; i++) {
    vec3 p = ro + rd * t;
    float d = map(p);
    if (d < .06) glowAcc += exp(-runeD(p) * (simple > .5 ? 14. : 28.)) * .012;
    if (d < .0006) { hit = true; break; }
    // The rune cuts are steep, so step carefully near them or the walls band.
    t += d * (runeD(p) < .1 ? .22 : .6);
    if (t > 9.) break;
  }
  vec3 L = lightCol;
  vec3 col = vec3(0); float alpha = 0.;
  if (hit) {
    vec3 p = ro + rd * t, n = normalAt(p);
    float ao = occlusion(p, n);
    float sh = shadow(p + n * .004, key);
    float r = runeD(p), w = runeW();
    float inCut = 1. - smoothstep(w * .45, w, r);
    // Basalt: near black, a little variation in tone, never a pattern.
    float tone = fbm((obj(p) + seed) * 7.) ;
    vec3 alb = vec3(.016, .016, .019) * (.6 + .8 * tone);
    float dif = max(dot(n, key), 0.);
    float rimL = pow(max(dot(n, rim), 0.), 2.);
    vec3 h = normalize(key - rd);
    float spec = pow(max(dot(n, h), 0.), 28.) * .06;
    col = alb * bright * (vec3(1., .96, .9) * 3.9 * dif * sh + vec3(.55, .65, .9) * 2.1 * bright * rimL * ao + vec3(.5, .55, .7) * .22 * ao);
    col += vec3(1., .96, .9) * spec * sh * (1. - inCut);
    // The rune's light on the stone around it.
    col += L * alb * 30. * exp(-r * 16.) * ao * glowK;
    // The cut itself: hot along the middle, flickering a little along its length.
    float flick = .65 + .7 * vnoise(obj(p) * 9. + seed);
    float core = 1. - smoothstep(0., w * .55, r);
    col += L * (inCut * 1.4 + core * core * 4.5) * flick * (.4 + glowK);
    col = mix(col, vec3(1., .93, .8) * L * 2.2, core * core * core * .2 * glowK);
    alpha = 1.;
  }
  // The stone layer of a bake keeps only the stone: no halo, not even a black one.
  if (stoneOnly < .5) {
    col += L * glowAcc * (.35 + glowK) * .8;
    alpha = max(alpha, clamp(glowAcc * 3. * (.35 + glowK), 0., 1.));
  }
  col = aces(col);
  col = pow(col, vec3(1. / 2.2));
  frag = vec4(col, alpha);
}`;

const VS = `#version 300 es
in vec2 pos; void main() { gl_Position = vec4(pos, 0, 1); }`;

const glc = document.getElementById('gl');
const gl = glc.getContext('webgl2', { premultipliedAlpha: false, preserveDrawingBuffer: true, alpha: true });
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS)); gl.linkProgram(prog);
gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, 'pos'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = n => gl.getUniformLocation(prog, n);

const val = id => +document.getElementById(id).value;
// The turn bake.py asks for, past the slider's quarter turn.
let yawOver = null;
// The forward tumble bake.py asks for, in degrees.
let tumbleOver = 0;
function renderGL(px, light, simple, stoneOnly = false, zoom = 1, bright = 1) {
  glc.width = glc.height = px;
  gl.viewport(0, 0, px, px);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U('res'), px, px);
  gl.uniform3fv(U('lightCol'), LIGHTS[light]);
  gl.uniform1f(U('yaw'), (yawOver ?? val('yaw')) * Math.PI / 180);
  gl.uniform1f(U('tumble'), tumbleOver * Math.PI / 180);
  gl.uniform1f(U('pitch'), val('pitch') * Math.PI / 180);
  gl.uniform1f(U('rough'), val('rough') / 60);
  gl.uniform1f(U('chips'), val('chips') / 55);
  gl.uniform1f(U('glowK'), val('glow') / 100);
  gl.uniform1f(U('seed'), val('seed') * 3.7);
  gl.uniform1f(U('simple'), simple ? 1 : 0);
  gl.uniform1f(U('stoneOnly'), stoneOnly ? 1 : 0);
  gl.uniform1f(U('zoom'), zoom);
  gl.uniform1f(U('bright'), bright);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
}
// Render big, then step down by halves, the way an icon is baked.
function into(canvas, size, light) {
  const simple = size <= 24;
  renderGL(Math.max(size * 4, 64), light, simple);
  let src = glc, w = glc.width;
  while (w / 2 >= size) {
    const t = document.createElement('canvas'); t.width = t.height = w / 2;
    const c = t.getContext('2d'); c.imageSmoothingQuality = 'high'; c.drawImage(src, 0, 0, w / 2, w / 2);
    src = t; w /= 2;
  }
  canvas.width = canvas.height = size;
  const c = canvas.getContext('2d'); c.imageSmoothingQuality = 'high'; c.clearRect(0, 0, size, size); c.drawImage(src, 0, 0, size, size);
  return canvas;
}
const mk = (size, light) => into(document.createElement('canvas'), size, light);

function draw() {
  const hero = document.getElementById('hero');
  renderGL(1280, current, false);
  hero.width = hero.height = 1280;
  hero.getContext('2d').clearRect(0, 0, 1280, 1280);
  hero.getContext('2d').drawImage(glc, 0, 0);
  const sizes = document.getElementById('sizes'); sizes.innerHTML = '';
  for (const s of [256, 128, 64, 48, 32, 24]) sizes.append(mk(s, current));
  const tray = document.createElement('div'); tray.className = 'tray';
  for (const l of ['gold', 'red', 'blue', 'green']) tray.append(mk(16, l));
  sizes.append(tray);
  const lb = document.createElement('div'); lb.className = 'lightbg';
  for (const s of [48, 24, 16]) lb.append(mk(s, current));
  sizes.append(lb);
  const states = document.getElementById('states'); states.innerHTML = '';
  for (const l of ['red', 'blue', 'green', 'violet']) states.append(mk(180, l));
}

const sw = document.getElementById('swatches');
for (const k of Object.keys(LIGHTS)) {
  const b = document.createElement('button'); b.textContent = k;
  b.onclick = () => { current = k; draw(); };
  sw.append(b);
}
let pending = 0;
for (const id of ['yaw', 'pitch', 'rough', 'chips', 'glow', 'seed']) document.getElementById(id).oninput = () => { cancelAnimationFrame(pending); pending = requestAnimationFrame(draw); };
document.getElementById('save').onclick = () => {
  renderGL(1024, current, false);
  const a = document.createElement('a'); a.download = `horadric-stone-${current}.png`; a.href = glc.toDataURL('image/png'); a.click();
};
const q = new URLSearchParams(location.search);
for (const id of ['yaw', 'pitch', 'rough', 'chips', 'glow', 'seed']) if (q.has(id)) document.getElementById(id).value = q.get(id);
if (q.has('light')) current = q.get('light');
if (q.has('bake')) {
  // Used by bake.py: render one layer and leave it in the page as a data URL.
  const px = +q.get('px'), light = q.get('light');
  if (q.has('yaw')) yawOver = +q.get('yaw');
  if (q.has('tumble')) tumbleOver = +q.get('tumble');
  renderGL(px, light, q.get('simple') === '1', light === 'none', +(q.get('zoom') || 1), +(q.get('bright') || 1));
  const out = document.createElement('pre'); out.id = 'baked';
  out.textContent = glc.toDataURL('image/png');
  document.body.append(out);
} else if (q.has('export')) {
  document.body.style.margin = '0';
  for (const el of document.body.children) if (el.id !== 'hero') el.style.display = 'none';
  const hero = document.getElementById('hero');
  hero.style.width = hero.style.height = '1024px';
  renderGL(1024, current, false);
  hero.width = hero.height = 1024;
  hero.getContext('2d').drawImage(glc, 0, 0);
} else draw();
</script>
</body></html>
