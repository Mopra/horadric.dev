[package]
name = "glance-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Cluster windows for Glance: Win32, Direct2D and DirectWrite, nothing in between"

[dependencies]
glance-core = { path = "../glance-core" }
glance-hooks = { path = "../glance-hooks" }
alacritty_terminal = { version = "0.26", default-features = false }

[target.'cfg(windows)'.dependencies]
glance-pty = { path = "../glance-pty" }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }
windows-numerics = "0.3"
