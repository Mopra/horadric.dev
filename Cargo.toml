[workspace]
resolver = "2"
members = ["crates/horadric-core", "crates/horadric-link", "crates/horadric-memory", "crates/horadric-hooks", "crates/horadric-pty", "crates/horadric-ui", "crates/horadric"]

[workspace.package]
version = "0.38.3"
edition = "2021"
license = "MIT"
repository = "https://github.com/Mopra/horadric.dev"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# The models' arithmetic, built optimised in debug builds too: unoptimised,
# dictating a sentence on a dev instance takes minutes instead of seconds.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm]
opt-level = 3
[profile.dev.package.gemm-common]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
